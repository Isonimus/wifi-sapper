; PlatformIO configuration for the WiFi Sapper.
; Portable, headless-first ESP-32 handshake-autohunt appliance (ADR-0001).

[platformio]
default_envs = cardputer
src_dir = src
test_dir = test

; ========================================
; Shared embedded settings
; ========================================
[env_embedded]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Pre-action: keep ieee80211_raw_frame_sanity_check weak so the raw-TX override links (ADR-0027).
; Idempotent — it weakens a library symbol. The strong override lives in raw_transmitter_esp32.cpp,
; which now compiles into every device build (ADR-0029 lifted ADR-0027's SAPPER_TEST_HOOKS gate);
; transmitting is gated at runtime by the operator's default-off deauth arm toggle, not at link time.
extra_scripts = pre:scripts/weaken_deauth_pre.py
; gnu++17, not strict c++17: the Board Profile is a constexpr aggregate built with designated
; initializers (a GNU extension in C++17), the safe way to fill a many-field pin table.
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -Wall
    -Wextra
build_unflags =
    -Werror=all
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    lovyan03/LovyanGFX@1.2.29
test_framework = unity

; ========================================
; M5Stack Cardputer ADV (ESP32-S3, no PSRAM) — reference board
; ========================================
[env:cardputer]
extends = env_embedded
; pioarduino platform: patched ESP-IDF libs that allow deauth-frame TX (ADR-0001).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
; Bruce's patched ESP32 Arduino libs (weak ieee80211_raw_frame_sanity_check).
platform_packages =
    framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/bruce_esp32-arduino-libs-20251205-131242.zip
board = m5stack-stamps3
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
; StampS3 has NO PSRAM. No memory_type override: qio_opi forces octal-PSRAM boot init that
; fails loudly on a chip-less board (the Adversary's hard-won note). QIO flash set explicitly.
board_build.flash_mode = qio
build_flags =
    ${env_embedded.build_flags}
    -DSAPPER_BOARD_CARDPUTER=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_ESP32S3_DEV=1

; ========================================
; Shared test-hooks flags + scripts: one source of truth for BOTH testhooks envs
; ========================================
; Every probe source (src/*_probe.cpp) compiles whenever SAPPER_TEST_HOOKS is set, so each one
; references its SAPPER_TEST_* macro unconditionally; a testhooks env that omits one will not
; build. Defining the full set here, once, is what keeps the two testhooks envs from drifting
; apart (a divergence previously broke the Stick testhooks build, slice-0079).
;
; SAPPER_TEST_HOOKS gates the compile-time credential seed fed through persistProvisioning() at
; boot (slice-0007 Scenario D). It is a BUILD-TIME injection, never a serial command (§4
; invariant #7). Credentials come from the operator's environment so no secret is committed; an
; unset var expands to an empty string, which the boot gate routes to the portal, so a testhooks
; build also serves as the Scenario B link-check with no credentials present. The deauth-weaken
; hook is re-listed (a referencing env replaces extra_scripts, it does not merge) alongside the
; pcap embedder, which reads SAPPER_TEST_UPLOAD_PCAP and generates src/gen/wpasec_test_pcap.h.
[testhooks]
extra_scripts =
    pre:scripts/weaken_deauth_pre.py
    pre:scripts/embed_test_pcap.py
build_flags =
    -DSAPPER_TEST_HOOKS=1
    -DSAPPER_TEST_WIFI_SSID='"${sysenv.SAPPER_TEST_WIFI_SSID}"'
    -DSAPPER_TEST_WIFI_PASS='"${sysenv.SAPPER_TEST_WIFI_PASS}"'
    -DSAPPER_TEST_WPASEC_KEY='"${sysenv.SAPPER_TEST_WPASEC_KEY}"'
    ; slice-0012 RF sniffer verify (ADR-0011): the target AP for the on-air beacon-reception proof.
    ; Strings, empty by default — an empty BSSID leaves the probe inactive so this build still boots
    ; normally (like empty credentials route to the portal). Set both to run `verify:rf-sniffer`.
    -DSAPPER_TEST_RF_BSSID='"${sysenv.SAPPER_TEST_RF_BSSID}"'
    -DSAPPER_TEST_RF_CHANNEL='"${sysenv.SAPPER_TEST_RF_CHANNEL}"'
    ; slice-0014 RF hop-and-discover verify (ADR-0013): the channel list to sweep and the optional
    ; per-channel dwell. Strings, empty by default — an empty channel list leaves the discover probe
    ; inactive so this build still boots normally. Set SAPPER_TEST_RF_HOP to run `verify:rf-discover`.
    -DSAPPER_TEST_RF_HOP='"${sysenv.SAPPER_TEST_RF_HOP}"'
    -DSAPPER_TEST_RF_DWELL_MS='"${sysenv.SAPPER_TEST_RF_DWELL_MS}"'
    ; slice-0016 HuntEngine verify (ADR-0015): the hop channel list the endless loop sweeps and the
    ; optional per-channel dwell. Strings, empty by default — an empty list leaves the hunt probe
    ; inactive so this build still boots normally. Set SAPPER_TEST_HUNT to run `verify:hunt`.
    -DSAPPER_TEST_HUNT='"${sysenv.SAPPER_TEST_HUNT}"'
    -DSAPPER_TEST_HUNT_DWELL_MS='"${sysenv.SAPPER_TEST_HUNT_DWELL_MS}"'
    ; slice-0018 wpa-sec upload verify (ADR-0017): set SAPPER_TEST_UPLOAD=1 to make the upload probe
    ; take over — associate, hunt, inject a stimulus handshake, and drive one TLS drain against the
    ; live wpa-sec (needs real WiFi creds + a real wpa-sec key above). Empty by default: normal boot.
    -DSAPPER_TEST_UPLOAD='"${sysenv.SAPPER_TEST_UPLOAD}"'
    ; slice-0020 wpa-sec cracked-sync verify (ADR-0019): set SAPPER_TEST_SYNC=1 to make the sync probe
    ; take over — associate, force a due sync (clock-advance stimulus), and drive one pinned-TLS
    ; `GET /?api&dl=1` download+parse+seed against the live wpa-sec (needs real WiFi creds + a real
    ; wpa-sec key above, and an account with a cracked result). Empty by default: normal boot.
    -DSAPPER_TEST_SYNC='"${sysenv.SAPPER_TEST_SYNC}"'
    ; slice-0022 status-LED verify (ADR-0021): set SAPPER_TEST_LED=1 to make the LED probe take over —
    ; associate, force STA windows and inject a synthetic new-password fact, driving the LED through
    ; working/hunting/recovered while the driver logs each `[LED] status=` (needs real WiFi creds + a
    ; real wpa-sec key above). Empty by default: normal boot.
    -DSAPPER_TEST_LED='"${sysenv.SAPPER_TEST_LED}"'
    ; slice-0024 push-webhook verify (ADR-0023): SAPPER_TEST_WEBHOOK_URL is the operator's ntfy/Discord
    ; endpoint, seeded through the provisioning seam (like the wpa-sec key); set SAPPER_TEST_WEBHOOK=1 to
    ; make the webhook probe take over — associate, inject a synthetic new-password fact, force an STA
    ; window, and POST it to the live endpoint over TLS (system CA bundle). Both empty by default: normal
    ; boot. The URL is a secret (topic/token), so it comes from the operator's env — never committed.
    -DSAPPER_TEST_WEBHOOK_URL='"${sysenv.SAPPER_TEST_WEBHOOK_URL}"'
    -DSAPPER_TEST_WEBHOOK='"${sysenv.SAPPER_TEST_WEBHOOK}"'
    ; slice-0036 capture-push verify (ADR-0035): set SAPPER_TEST_WEBHOOK_CAPTURE=1 to make the sibling
    ; capture-push probe take over — force capture-push on, inject a synthetic capture fact, force an STA
    ; window, and POST it to the same live endpoint. Reuses SAPPER_TEST_WEBHOOK_URL. Empty by default.
    -DSAPPER_TEST_WEBHOOK_CAPTURE='"${sysenv.SAPPER_TEST_WEBHOOK_CAPTURE}"'
    ; slice-0026 screen-toast verify (ADR-0025): set SAPPER_TEST_SCREEN=1 to make the screen probe take
    ; over — render the status HUD and arm the CRACKED banner, then stream the canvas `dump` for a PNG.
    ; Needs no network (rendering is local). Empty by default: normal boot.
    -DSAPPER_TEST_SCREEN='"${sysenv.SAPPER_TEST_SCREEN}"'
    ; slice-0042 panel proof (ADR-0041): set SAPPER_TEST_PANEL=1 to make the panel probe take over — render
    ; the RGB/border/diagonal diagnostic (the ADR-0002 §5 panel proof, formerly the shipped boot face) so
    ; `verify:device` can `dump` it to a PNG. The shipped boot face is now a product splash; the diagnostic
    ; lives only in this hooks build. Needs no network (rendering is local). Empty by default: normal boot.
    -DSAPPER_TEST_PANEL='"${sysenv.SAPPER_TEST_PANEL}"'
    ; slice-0032 capture-notification verify (ADR-0031): set SAPPER_TEST_CAPTURE=1 to make the capture
    ; probe take over — inject captures on a cadence so the SerialEventLogger emits a repeating
    ; `[CAPTURE] essid=…` line and the panel shows the CAPTURED banner for a `dump`. Needs no network
    ; (a capture is announced at enqueue). Empty by default: normal boot.
    -DSAPPER_TEST_CAPTURE='"${sysenv.SAPPER_TEST_CAPTURE}"'
    ; slice-0034 live-hunt-HUD verify (ADR-0033): set SAPPER_TEST_HUNT_HUD=1 to make the hunt-HUD probe
    ; take over — inject a synthetic AP + handshake through the engine's onFrame seam so the panel shows
    ; the live-hunt line (target + B/M1/M2 indicators + progress bar), then `dump` it. Needs no network.
    ; Empty by default: normal boot.
    -DSAPPER_TEST_HUNT_HUD='"${sysenv.SAPPER_TEST_HUNT_HUD}"'
    ; slice-0028 deauth verify (ADR-0027): set SAPPER_TEST_DEAUTH_BSSID + _CHANNEL to make the deauth
    ; probe take over — transmit deauth/disassoc at the target and capture the handshake it forces.
    ; _CLIENT is optional (a specific station MAC; empty -> broadcast). Strings, empty by default — an
    ; empty BSSID leaves the probe inactive so this build still boots normally. This bench PROBE is
    ; test-hooks-only; the raw-TX capability itself now also ships in env:cardputer, gated at runtime by
    ; the deauth arm toggle (ADR-0029, verify:deauth-loop). Deauth only your own authorized network.
    -DSAPPER_TEST_DEAUTH_BSSID='"${sysenv.SAPPER_TEST_DEAUTH_BSSID}"'
    -DSAPPER_TEST_DEAUTH_CHANNEL='"${sysenv.SAPPER_TEST_DEAUTH_CHANNEL}"'
    -DSAPPER_TEST_DEAUTH_CLIENT='"${sysenv.SAPPER_TEST_DEAUTH_CLIENT}"'
    ; slice-0040 maintenance-mode verify (ADR-0039): the BOOT-hold that enters Maintenance is physical, so
    ; the headless verify forces entry at compile time — set SAPPER_TEST_MAINT=1 to make maintenanceRequested()
    ; return true this boot (a build-time hook like the credential seed, never a serial path, §4 #7). Empty
    ; by default so this build still boots normally. SAPPER_TEST_MAINT_PASS seeds the hardened AP passphrase
    ; through the provisioning seam (like the wpa-sec key), so the verify can assert the AP requires it.
    -DSAPPER_TEST_MAINT='"${sysenv.SAPPER_TEST_MAINT}"'
    -DSAPPER_TEST_MAINT_PASS='"${sysenv.SAPPER_TEST_MAINT_PASS}"'
    ; slice-0058 keyboard-keycode probe (ADR-0057): set SAPPER_TEST_KB=1 to make the keyboard probe take
    ; over — bring up the TCA8418 and log each keypress's decoded key number so the operator presses 'm'
    ; and confirms code=48 (verify:keyboard). Empty by default: normal boot. Needs no network.
    -DSAPPER_TEST_KB='"${sysenv.SAPPER_TEST_KB}"'
    ; ADR-0067 RSSI↔capture-correlation probe: set SAPPER_TEST_RSSI to a channel list (e.g. "1,6,11") to
    ; make the probe take over — run the real ARMED hunt (deauth on) while tapping each beacon's rx_ctrl.rssi
    ; out-of-band, and emit one identity-free `[RSSI] rssi=… outcome=captured|empty` row per capture attempt
    ; (probe:rssi bins them). Answers whether RSSI predicts capture before paying the §4 #8 seam cost. Empty
    ; by default: normal boot. Needs no network. Deauth only your own authorized networks (§4 #16). The run
    ; is untethered (no serial visible), so the probe accumulates a compact per-band histogram to LittleFS
    ; and dumps it at boot on reattach. SAPPER_TEST_RSSI_RUN tags the run: a boot whose tag differs from the
    ; persisted file starts the counters fresh; a matching tag resumes (so a field power-cycle continues,
    ; but bumping the tag + reflashing begins a clean run). Empty defaults to "default".
    -DSAPPER_TEST_RSSI='"${sysenv.SAPPER_TEST_RSSI}"'
    -DSAPPER_TEST_RSSI_RUN='"${sysenv.SAPPER_TEST_RSSI_RUN}"'

; ========================================
; Cardputer + test hooks (ADR-0006 #7) — bench verify only, never a shipped build
; ========================================
[env:cardputer_testhooks]
extends = env:cardputer
extra_scripts = ${testhooks.extra_scripts}
build_flags =
    ${env:cardputer.build_flags}
    ${testhooks.build_flags}

; ========================================
; M5StickC Plus2 (ESP32-PICO-V3-02, 2 MB PSRAM) — slice-8 second board (slice-0079)
; ========================================
[env:m5stickc_plus2]
extends = env_embedded
; Same pioarduino platform + Bruce patched libs as the Cardputer: the deauth-frame TX capability
; (ADR-0001/ADR-0029) is core to the appliance on every board, not Cardputer-specific. The weaken
; pre-script is inherited from env_embedded.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/bruce_esp32-arduino-libs-20251205-131242.zip
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
; 8 MB flash (ESP32-PICO-V3-02 SiP). esp32dev defaults to 4 MB + a 1.25 MB app partition, which the
; ~1.4 MB firmware overflows; mirror the Cardputer's 8 MB layout (default_8MB.csv: 3.3 MB app, OTA-ready).
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    ${env_embedded.build_flags}
    -DSAPPER_BOARD_M5STICKC_PLUS2=1
    ; No board_build.arduino.memory_type (or qio/dio PSRAM-mode knob) is set, on purpose: that knob only
    ; configures PSRAM when Arduino is built from source and its sdkconfig is generated. Here the precompiled
    ; Bruce libs ship a fixed sdkconfig with CONFIG_SPIRAM=y + CONFIG_SPIRAM_USE_MALLOC=y, so ESP-IDF maps
    ; PSRAM into the heap at boot and heap_caps_malloc(MALLOC_CAP_SPIRAM) works from BOARD_HAS_PSRAM alone
    ; (ADR-0080). Proven on device: heap_max ~2.06 MB, both manifest allocs succeed, no [FATAL]. Do not add
    ; memory_type to "fix" this; it is inert against precompiled libs.
    -DBOARD_HAS_PSRAM   ; ESP32-PICO-V3-02 carries 2 MB Quad PSRAM (hasPsram=true in the profile)

; ========================================
; M5StickC Plus2 + test hooks (ADR-0006 #7) — bench verify only, never a shipped build
; ========================================
; The same shared [testhooks] flags + scripts as the Cardputer, over the Stick's base env. Every
; probe source compiles under SAPPER_TEST_HOOKS, so this env needs the full SAPPER_TEST_* set too;
; sharing one definition is what stops the two envs drifting (slice-0079).
[env:m5stickc_plus2_testhooks]
extends = env:m5stickc_plus2
extra_scripts = ${testhooks.extra_scripts}
build_flags =
    ${env:m5stickc_plus2.build_flags}
    ${testhooks.build_flags}

; ========================================
; LilyGo T-embed (ESP32-S3, 8 MB octal PSRAM, 16 MB flash) — slice-8 third board (slice-0081)
; ========================================
[env:t_embed]
extends = env_embedded
; Same pioarduino platform + Bruce patched libs as the other boards: the deauth-frame TX capability
; (ADR-0001/ADR-0029) is core on every board. The weaken pre-script is inherited from env_embedded.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/bruce_esp32-arduino-libs-20251205-131242.zip
; N16R8 = 16 MB flash + 8 MB octal (opi) PSRAM, matching the chip read off the device (esptool: ESP32-S3,
; 8 MB octal PSRAM, 16 MB flash). The board def sets default_16MB.csv and auto-adds -DBOARD_HAS_PSRAM and
; -DARDUINO_ESP32S3_DEV; it also sets memory_type=qio_opi, which is INERT against the precompiled Bruce libs
; (their sdkconfig is fixed, ADR-0080), so whether the octal PSRAM actually inits is proven on device by the
; heap-caps accounting (slice-0081), not asserted by this knob.
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
build_flags =
    ${env_embedded.build_flags}
    -DSAPPER_BOARD_T_EMBED=1
    ; Native USB-Serial/JTAG (ttyACM, no reset-on-open), like the Cardputer, not a UART bridge like the Stick.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; BOARD_HAS_PSRAM is also auto-added by the N16R8 board def; stated here too so the PSRAM path is greppable
    ; in the env. Octal-PSRAM-live is the measured gate (ADR-0080): if it does not init under the precompiled
    ; libs, the fallback is the no-PSRAM S3 static-DRAM path the Cardputer already proves (slice-0081).
    -DBOARD_HAS_PSRAM

; ========================================
; T-embed + test hooks (ADR-0006 #7) — bench verify only, never a shipped build
; ========================================
; The same shared [testhooks] flags + scripts as the other boards, over the T-embed base env. Every probe
; source compiles under SAPPER_TEST_HOOKS, so this env needs the full SAPPER_TEST_* set too; sharing one
; definition is what stops the three envs drifting (slice-0079).
[env:t_embed_testhooks]
extends = env:t_embed
extra_scripts = ${testhooks.extra_scripts}
build_flags =
    ${env:t_embed.build_flags}
    ${testhooks.build_flags}

; ========================================
; ESP32-3248S035C "CYD" (classic ESP32-D0WD-V3, no PSRAM, 4 MB flash) — slice-8 fourth board (slice-0083)
; ========================================
; The first board that is BOTH no-PSRAM AND a classic ESP32. Same pioarduino platform + Bruce patched libs
; as the others (the deauth-frame TX capability is core on every board). The weaken pre-script is inherited
; from env_embedded. USB is a CH340 UART bridge (/dev/ttyUSB, resets on open), not native USB-CDC, so no
; ARDUINO_USB_* flags. This slice is the HEADLESS hunter: the board flag maps to a hasDisplay=false profile,
; so no LGFX class compiles and the HAL is NullDisplay (the 320x480 ST7796 panel is a later slice).
[env:cyd_3248s035c]
extends = env_embedded
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/bruce_esp32-arduino-libs-20251205-131242.zip
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
; 4 MB flash. esp32dev's stock layout gives a 1.25 MB app partition, which the ~1.4 MB firmware overflows
; (the same note the Stick's env carries). huge_app.csv is the standard no-OTA 4 MB layout (3 MB app +
; ~896 KB spiffs/data); the ~1.4 MB app fits with margin and LittleFS mounts on the spiffs-subtype data
; partition exactly as on the other boards.
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
build_flags =
    ${env_embedded.build_flags}
    -DSAPPER_BOARD_ESP32_3248S035C=1
    ; No-PSRAM classic ESP32: the two ~28KB static CrackedManifest instances overflow .dram0.bss (measured
    ; 27056 bytes, slice-0083) and there is no PSRAM to escape to. Place the one live manifest in the internal
    ; DRAM heap instead (ADR-0082): hunt and Maintenance are mutually-exclusive phases, so only one is ever live.
    -DSAPPER_MANIFEST_HEAP_INTERNAL=1

; ========================================
; CYD + test hooks (ADR-0006 #7) — bench verify only, never a shipped build
; ========================================
[env:cyd_3248s035c_testhooks]
extends = env:cyd_3248s035c
extra_scripts = ${testhooks.extra_scripts}
build_flags =
    ${env:cyd_3248s035c.build_flags}
    ${testhooks.build_flags}

; ========================================
; Native — host unit tests (ADR-0004 lane 1)
; ========================================
[env:native]
; Fully qualified as `platformio/native`, NOT bare `native`, on purpose: this repo has a
; top-level `native/` directory (the -I native/mock fake <Preferences.h> below), and PlatformIO
; resolves a bare `platform = native` against the project cwd first — `os.path.isdir("native")` is
; true, so it treats the local folder as the platform, finds no platform.json, and dies with
; `UnknownPlatform: native`. The owner/name form skips the local-dir lookup and resolves from the
; registry. Do NOT shorten this back to `native` (ADR-0051).
platform = platformio/native
test_framework = unity
; Only the hardware-free sources compile here (ADR-0001): the pure serial parser, the pure
; provisioning logic, the NVS store behind a fake <Preferences.h> (ADR-0008), the pure capture
; core — EAPOL/802.11 parsing, deauth/disassoc frame construction (ADR-0027), the handshake
; accumulator, pcap serialization (ADR-0009), the
; channel-hop schedule and beacon-based AP registry (ADR-0013), the HuntEngine state machine that
; orchestrates them (ADR-0015), and the pure surface policy — the LED status surface over the event
; bus (ADR-0021), the push-notification notifier (ADR-0023), the status-HUD/toast policy that
; produces a ScreenView (ADR-0025), the pure Maintenance dashboard renderer (ADR-0039/ADR-0043), and
; the pure Maintenance reboot-intent decision + TCA8418 key-event decode (ADR-0057, the latter a
; header-only unit needing no source entry), and the pure button-hold entry gesture (ADR-0078).
; The HAL real impls (including the Esp32 LED driver, the Esp32
; webhook transport, and the Esp32 screen renderer), the serial dispatch, the captive portal, the
; STA/NTP glue, the device RF wrappers/probes (including led_probe, webhook_probe, screen_probe, the
; Esp32 raw transmitter and deauth_probe), and main.cpp are device-only and excluded. The store is not UNIT_TEST-guarded, so with the fake header it
; compiles unchanged. core/event_bus.h and core/deadline.h are header-only and need no entry.
build_src_filter =
    -<*>
    +<hal/serial/serial_command.cpp>
    +<config/maintenance_intent.cpp>
    +<config/button_hold.cpp>
    +<net/provisioning.cpp>
    +<net/provisioning_store.cpp>
    +<net/provisioning_form.cpp>
    +<net/eapol.cpp>
    +<net/deauth.cpp>
    +<net/handshake_collector.cpp>
    +<net/channel_hopper.cpp>
    +<net/ap_registry.cpp>
    +<net/hunt_engine.cpp>
    +<net/pcap.cpp>
    +<net/capture_queue.cpp>
    +<net/upload_supervisor.cpp>
    +<net/wpasec_response.cpp>
    +<net/cracked_result_parser.cpp>
    +<net/cracked_manifest.cpp>
    +<net/submitted_manifest.cpp>
    +<net/rssi_histogram.cpp>
    +<net/cracked_sync.cpp>
    +<net/dashboard.cpp>
    +<surface/led_status_surface.cpp>
    +<surface/webhook_notifier.cpp>
    +<surface/screen_toast_surface.cpp>
; -I native/mock resolves <Preferences.h> to the in-memory fake for this lane only (ADR-0008);
; device envs have no such -I and use the real ESP-IDF header.
build_flags =
    -std=gnu++17
    -DUNIT_TEST=1
    -DNATIVE_BUILD=1
    -I src
    -I native/mock
    -g
    -O0
test_build_src = yes
lib_deps =
    throwtheswitch/Unity@2.6.0
